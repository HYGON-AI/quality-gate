name: HYGON Quality Gate Engine
description: Locate the immutable incremental PR gate checked out by the reusable workflow.

outputs:
  gate-path:
    description: Absolute path to the checked-out quality gate.
    value: ${{ steps.locate.outputs.gate-path }}
  python-path:
    description: Existing Python 3.9+ interpreter, with isolated PyYAML installation when needed.
    value: ${{ steps.locate.outputs.python-path }}

runs:
  using: composite
  steps:
    - id: locate
      name: Prepare quality gate Python and dependencies
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/scripts/prepare-python.sh"
