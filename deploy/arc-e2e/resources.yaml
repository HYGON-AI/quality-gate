apiVersion: v1
kind: Namespace
metadata:
  name: github-ci-arc-e2e
  labels:
    ci.hygon.cn/pilot: arc-e2e-20261106
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.31
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: arc-e2e-compute
  namespace: github-ci-arc-e2e
automountServiceAccountToken: false
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: arc-e2e-budget
  namespace: github-ci-arc-e2e
spec:
  hard:
    requests.cpu: "16"
    limits.cpu: "16"
    requests.memory: 32Gi
    limits.memory: 32Gi
    requests.ephemeral-storage: 8Gi
    limits.ephemeral-storage: 8Gi
    requests.hygon.com/hcu: "4"
    requests.hygon.com/dcu: "0"
    pods: "4"
    count/jobs.batch.volcano.sh: "4"
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: arc-e2e-deny-network
  namespace: github-ci-arc-e2e
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: scheduling.volcano.sh/v1beta1
kind: Queue
metadata:
  name: arc-e2e
  labels: {ci.hygon.cn/pilot: arc-e2e-20261106}
spec:
  weight: 1
  reclaimable: true
  capability: {cpu: "16", memory: 32Gi, hygon.com/hcu: "4"}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: arc-e2e-submit
  namespace: github-ci-arc-e2e
rules:
  - apiGroups: [batch.volcano.sh]
    resources: [jobs]
    verbs: [create, get, list, watch, delete]
  - apiGroups: [""]
    resources: [pods, pods/log, events]
    verbs: [get, list, watch]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: arc-e2e-boundary
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels: {ci.hygon.cn/pilot: arc-e2e-20261106}
    resourceRules:
      - apiGroups: [batch.volcano.sh]
        apiVersions: [v1alpha1]
        operations: [CREATE, UPDATE]
        resources: [jobs]
  validations:
    - expression: "object.spec.queue == 'arc-e2e' && object.spec.schedulerName == 'volcano' && (!has(object.spec.plugins) || size(object.spec.plugins) == 0) && object.spec.maxRetry == 1 && object.spec.minAvailable == 1 && object.spec.ttlSecondsAfterFinished <= 600 && object.spec.policies == [{'event':'TaskCompleted','action':'CompleteJob'},{'event':'PodFailed','action':'TerminateJob'}]"
      message: "E2E job requires fixed queue/scheduler, bounded TTL, no retry/plugins"
    - expression: "size(object.spec.tasks) == 1 && object.spec.tasks.all(t, t.replicas == 1 && (!has(t.policies) || size(t.policies) == 0))"
      message: "E2E job has one task/replica"
    - expression: "object.spec.tasks.all(t, t.template.spec.serviceAccountName == 'arc-e2e-compute' && t.template.spec.automountServiceAccountToken == false && (!has(t.template.spec.volumes) || size(t.template.spec.volumes) == 0))"
      message: "E2E compute cannot mount credentials or volumes"
    - expression: "object.spec.tasks.all(t, size(t.template.spec.nodeSelector) == 1 && t.template.spec.nodeSelector['kubernetes.io/hostname'] == 'github-nmz3' && !has(t.template.spec.nodeName) && t.template.spec.activeDeadlineSeconds > 0 && t.template.spec.activeDeadlineSeconds <= 180 && t.template.spec.terminationGracePeriodSeconds <= 10 && t.template.spec.restartPolicy == 'Never')"
      message: "E2E job must be time bounded and pinned to nmz3"
    - expression: "object.spec.tasks.all(t, (!has(t.template.spec.hostNetwork) || !t.template.spec.hostNetwork) && (!has(t.template.spec.hostPID) || !t.template.spec.hostPID) && (!has(t.template.spec.hostIPC) || !t.template.spec.hostIPC) && (!has(t.template.spec.initContainers) || size(t.template.spec.initContainers) == 0) && size(t.template.spec.containers) == 1)"
      message: "E2E job cannot access host namespaces or init containers"
    - expression: "object.spec.tasks.all(t, t.template.spec.securityContext.runAsNonRoot == true && t.template.spec.securityContext.runAsUser == 1001 && t.template.spec.securityContext.runAsGroup == 1001 && t.template.spec.securityContext.seccompProfile.type == 'RuntimeDefault' && t.template.spec.securityContext.supplementalGroups == [39,998])"
      message: "E2E compute must be non-root with fixed device groups"
    - expression: "object.spec.tasks.all(t, t.template.spec.containers.all(c, c.image == '42.228.13.241:5000/dcu/admin/base/pytorch@sha256:07c285c51837d76fbcc73b771b1a95ecf2d8b71203e5feadb3cb9cb12b5d3f4d' && c.imagePullPolicy == 'Never' && (!has(c.securityContext.privileged) || !c.securityContext.privileged) && c.securityContext.allowPrivilegeEscalation == false && c.securityContext.capabilities.drop == ['ALL'] && (!has(c.securityContext.capabilities.add) || size(c.securityContext.capabilities.add) == 0) && (!has(c.volumeMounts) || size(c.volumeMounts) == 0)))"
      message: "E2E compute requires fixed cached image, no privileges or mounts"
    - expression: "object.spec.tasks.all(t, t.template.spec.containers.all(c, c.resources.requests == c.resources.limits && c.resources.limits.all(k, k in ['cpu','memory','ephemeral-storage','hygon.com/hcu']) && c.resources.limits['cpu'] == '2' && c.resources.limits['memory'] == '8Gi' && c.resources.limits['ephemeral-storage'] == '2Gi' && (!('hygon.com/hcu' in c.resources.limits) || c.resources.limits['hygon.com/hcu'] in ['1','2'])))"
      message: "E2E profiles have fixed CPU/RAM/storage and at most 2 HCU per job"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: arc-e2e-boundary
spec:
  policyName: arc-e2e-boundary
  validationActions: [Deny]
---
# Applied only AFTER all negative admission tests pass.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: arc-e2e-submit
  namespace: github-ci-arc-e2e
subjects:
  - kind: ServiceAccount
    name: arc-pilot-submitter
    namespace: arc-runners
roleRef:
  kind: Role
  name: arc-e2e-submit
  apiGroup: rbac.authorization.k8s.io
