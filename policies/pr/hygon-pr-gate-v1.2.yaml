schema_version: 1
policy_id: hygon-pr-gate-v1.2
report_language: zh-CN

# The public PR gate carries only the policy fields required for incremental
# checks. Whole-repository audit policy and audit skills remain separate.
open_source_policy: hygon-open-source-v1.4
quality_security_policy: hygon-quality-security-v1.1

scope:
  files: merge-base-to-head
  commits: base-exclusive-head-inclusive
  block_new_findings_only: true
  retain_reports: false

blocking:
  real_secrets: true
  forbidden_identities: true
  dangerous_git_objects: true
  definite_syntax_errors: true
  # Semgrep 模式命中需要结合外部输入可达性核对，默认不单独阻断。
  semgrep_error_rules: false
  trivy_fixable_severities:
    - CRITICAL
  legal_file_or_original_header_damage: true
  definite_new_source_or_third_party_noncompliance: true

advisory:
  trivy_severities:
    - HIGH
  semgrep_warning_rules: true
  shellcheck_warning: true
  yaml_style: true
  crlf: true
  large_file_review: true
  complexity: true
  commit_message_style: true
  uncertain_provenance: true
  mutable_action_reference: true
  semgrep_rule_ids:
    - hygon.python.subprocess-shell-true

git:
  max_text_scan_bytes: 4194304
  large_file_review_bytes: 10485760
  large_file_block_bytes: 52428800
  source_header_scan_lines: 100

sensitive_diff:
  enabled: true
  legacy_dcu:
    terms:
      - dcu
    allowed_content_patterns:
      - '(?:https?://)?harbor\.sourcefind\.cn:5443/dcu(?:/[A-Za-z0-9._:@/+~-]+)*'
    allowed_identifiers:
      - DCUTLASS_ENABLE_TENSOR_CORE_MMA
      - USE_DCU_CUSTOM_ALLREDUCE
      - SGLANG_KV_LAYOUT_DCU_FA
      - dcu_mla
    allowed_identifier_patterns:
      - '^DCUTLASS_[A-Z0-9_]+$'
    allowed_url_patterns:
      - '^https://harbor\.sourcefind\.cn:5443/dcu(?:/.*)?$'
    advisory_paths:
      - "docs/internal/**"
    excluded_paths: []
  hcu_runtime:
    terms:
      - amd
      - xgmi
    hcu_markers:
      - is_hcu
      - _is_hcu
      - HCUBackend
      - HWBackend.HCU
    non_hcu_markers:
      - is_amd
      - _is_amd
      - AMDBackend
      - HWBackend.AMD
    hcu_owned_paths:
      - "**/hcu/**"
      - "**/*_hcu.py"
      - "**/hcu_*.py"
      - ".github/workflows/*hcu*.yml"
      - ".github/workflows/*hcu*.yaml"
      - "scripts/**/*hcu*"
    excluded_paths:
      - "docs/**"
      - "**/docs/**"
      - "test/**"
      - "tests/**"
      - "**/test/**"
      - "**/tests/**"
    allowed_output_patterns:
      - '\bAMD\s+CPUs?\b'
      - '\bAMD/HIP\s+backend\s+compatibility\b'
      - '\bamd64\b'
      - '\bAMDGPU_TARGETS\b'
      - '\bHSA_XGMI_[A-Za-z0-9_]*\b'

dependency_manifests:
  - "**/pyproject.toml"
  - "**/setup.py"
  - "**/setup.cfg"
  - "**/requirements*.txt"
  - "**/requirements*.in"
  - "**/constraints*.txt"
  - "**/poetry.lock"
  - "**/Pipfile.lock"
  - "**/uv.lock"
  - "**/package-lock.json"
  - "**/pnpm-lock.yaml"
  - "**/yarn.lock"
  - "**/go.sum"
  - "**/Cargo.lock"
  - "**/pom.xml"
  - "**/build.gradle"
  - "**/build.gradle.kts"

external_scanners:
  enabled: true
  network: disabled
  docker_pull: never
  docker_cpus: 16
  docker_memory: 32g
  timeout_seconds: 1800
