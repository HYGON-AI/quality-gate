schema_version: 1
repository: HYGON-AI/sglang-das
policy: hygon-pr-gate-v1.1
license: Apache-2.0

checks:
  security: true
  quality: true
  compliance: true
  commit_identity: true
  hcu_runtime_wording: true

legal_files:
  - LICENSE
  - NOTICE

third_party_registries:
  - THIRD_PARTY_NOTICES.md
  - NOTICE

third_party_paths:
