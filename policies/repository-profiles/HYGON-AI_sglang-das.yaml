schema_version: 1
repository: HYGON-AI/sglang-das
policy: hygon-pr-gate-v1.1
license: Apache-2.0

checks:
  security: true
  quality: true
  compliance: true
  commit_identity: true
  sensitive_diff: true
  hcu_runtime_wording: true

sensitive_diff:
  legacy_dcu:
    excluded_paths: []
    allowed_identifiers:
      - DCUTLASS_ENABLE_TENSOR_CORE_MMA
    allowed_identifier_patterns:
      - '^DCUTLASS_[A-Z0-9_]+$'
    allowed_url_patterns:
      - '^https://harbor\.sourcefind\.cn:5443/dcu(?:/.*)?$'
  hcu_runtime:
    hcu_owned_paths:
      - "**/hcu/**"
      - "**/*_hcu.py"
      - "**/hcu_*.py"
      - ".github/workflows/*hcu*.yml"
      - ".github/workflows/*hcu*.yaml"
      - "scripts/**/*hcu*"
    excluded_paths:
      - "test/registered/amd/**"

legal_files:
  - LICENSE
  - NOTICE

third_party_registries:
  - THIRD_PARTY_NOTICES.md
  - NOTICE

third_party_paths:
  - "third_party/**"
  - "3rdparty/**"
  - "**/third_party/**"
  - "**/3rdparty/**"

generated_paths:
  - "**/version.py"
  - "**/*_pb2.py"
  - "**/*_pb2_grpc.py"
