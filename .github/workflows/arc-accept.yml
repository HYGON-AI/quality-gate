# ARC + K8s acceptance for the production pools. Runs only on push to the test branch when the mode file changes.
# mode=basic  : T1 pools, T2 1/4/8 cards + 4 concurrent 1-card jobs, T4 build->test, T12 storage/network, T13 token
# mode=faults : T7 failure (exit 17), timeout (holding a card), then a recovery job; cancel is triggered manually
name: ARC acceptance (test branch only)
on:
  push:
    branches: [test/arc-accept-20261108]
    paths: [.github/arc-accept/mode]
permissions:
  contents: read
concurrency:
  group: arc-accept
  cancel-in-progress: false
# job container image (env context is not allowed in jobs.<id>.container, so it is written literally below):
#   10.16.1.152:5000/jenkins/model_test_env/sglang:0.5.18-ubuntu22.04-dtk26041-py3.10-20261103-0633
jobs:
  plan:
    if: github.repository == 'HYGON-AI/quality-gate' && github.ref == 'refs/heads/test/arc-accept-20261108'
    runs-on: hygon-cpu
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.m.outputs.mode }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - id: m
        run: |
          echo "mode=$(tr -d '[:space:]' < .github/arc-accept/mode)" >> "$GITHUB_OUTPUT"
          echo "runner=$RUNNER_NAME nproc=$(nproc) user=$(id -u)"
          test -e /var/run/secrets/kubernetes.io/serviceaccount/token && echo "cpu runner has SA token" || echo "cpu runner has no SA token"

  build:
    needs: plan
    if: needs.plan.outputs.mode == 'basic'
    runs-on: hygon-build
    timeout-minutes: 30
    container: {image: '10.16.1.152:5000/jenkins/model_test_env/sglang:0.5.18-ubuntu22.04-dtk26041-py3.10-20261103-0633'}
    env: {ACCEPT_ROLE: build, EXPECTED_CARDS: '0', ACCEPT_NAME: build}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - run: python3 tests/arc_accept/check.py
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: 'accept-build', path: accept-out/, retention-days: 7, if-no-files-found: error}

  cards:
    needs: [plan, build]
    if: needs.plan.outputs.mode == 'basic'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: c1-a, cards: 1}
          - {name: c1-b, cards: 1}
          - {name: c1-c, cards: 1}
          - {name: c1-d, cards: 1}
          - {name: c4, cards: 4}
          - {name: c8, cards: 8}
    name: cards (${{ matrix.name }})
    runs-on: hygon-bw1100-${{ matrix.cards }}card
    timeout-minutes: 40
    container: {image: '10.16.1.152:5000/jenkins/model_test_env/sglang:0.5.18-ubuntu22.04-dtk26041-py3.10-20261103-0633'}
    env: {ACCEPT_ROLE: card, EXPECTED_CARDS: '${{ matrix.cards }}', ACCEPT_NAME: '${{ matrix.name }}', HOLD_SECONDS: '90'}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - run: python3 tests/arc_accept/check.py
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: 'accept-${{ matrix.name }}', path: accept-out/, retention-days: 7, if-no-files-found: error}

  verify:
    needs: [plan, build, cards]
    if: always() && needs.plan.outputs.mode == 'basic'
    runs-on: hygon-cpu
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {path: results, pattern: 'accept-*'}
      - run: python3 tests/arc_accept/verify.py

  fault-exit:
    needs: plan
    if: needs.plan.outputs.mode == 'faults'
    runs-on: hygon-bw1100-1card
    timeout-minutes: 10
    container: {image: '10.16.1.152:5000/jenkins/model_test_env/sglang:0.5.18-ubuntu22.04-dtk26041-py3.10-20261103-0633'}
    env: {ACCEPT_ROLE: card, EXPECTED_CARDS: '1', ACCEPT_NAME: fault-exit, FORCE_EXIT: '17'}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - run: python3 tests/arc_accept/check.py

  fault-timeout:
    needs: plan
    if: needs.plan.outputs.mode == 'faults'
    runs-on: hygon-bw1100-1card
    timeout-minutes: 4
    container: {image: '10.16.1.152:5000/jenkins/model_test_env/sglang:0.5.18-ubuntu22.04-dtk26041-py3.10-20261103-0633'}
    env: {ACCEPT_ROLE: card, EXPECTED_CARDS: '1', ACCEPT_NAME: fault-timeout, HOLD_SECONDS: '900'}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - run: python3 tests/arc_accept/check.py

  fault-cancel:
    needs: plan
    if: needs.plan.outputs.mode == 'faults'
    runs-on: hygon-bw1100-1card
    timeout-minutes: 20
    container: {image: '10.16.1.152:5000/jenkins/model_test_env/sglang:0.5.18-ubuntu22.04-dtk26041-py3.10-20261103-0633'}
    env: {ACCEPT_ROLE: card, EXPECTED_CARDS: '1', ACCEPT_NAME: fault-cancel, HOLD_SECONDS: '900'}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - run: python3 tests/arc_accept/check.py

  recovery:
    needs: [plan, fault-exit, fault-timeout]
    if: always() && needs.plan.outputs.mode == 'faults'
    runs-on: hygon-bw1100-8card
    timeout-minutes: 40
    container: {image: '10.16.1.152:5000/jenkins/model_test_env/sglang:0.5.18-ubuntu22.04-dtk26041-py3.10-20261103-0633'}
    env: {ACCEPT_ROLE: card, EXPECTED_CARDS: '8', ACCEPT_NAME: recovery-8card}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - run: python3 tests/arc_accept/check.py
