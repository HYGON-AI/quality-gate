# Experimental branch only: reuse the already registered manual workflow entry.
name: K8s Volcano Validation Pilot
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        default: success
        options: [success, failure, runtime-timeout, cancel, github-timeout, concurrent, queue]
permissions:
  contents: read
jobs:
  experiment:
    uses: ./.github/workflows/k8s-ci-validation.yml
    with:
      mode: ${{ inputs.mode }}
