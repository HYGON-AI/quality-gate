name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  self-test:
    name: PR Gate Self Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3

      - name: Install
        run: python3 -m pip install -e .

      - name: Compile
        run: python3 -m compileall -q src tests

      - name: Test
        env:
          PYTHONPATH: src
        run: python3 tests/pr_gate_self_test.py
