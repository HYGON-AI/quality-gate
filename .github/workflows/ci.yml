name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  self-test:
    name: PR Gate Self Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3

      - name: Install
        run: python3 -m pip install -e .

      - name: Compile
        run: python3 -m compileall -q src tests

      - name: Test
        env:
          PYTHONPATH: src
        run: python3 tests/pr_gate_self_test.py

      - name: Unit regressions
        env:
          PYTHONPATH: src
          CORE_GOVERNANCE_SUMMARIES: '1'
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Runner bootstrap integration
        run: python3 tests/runner_bootstrap_integration.py -v

      - name: Preinstall pinned secret scanner for integration test
        run: |
          image=$(python3 -c 'import yaml; print(yaml.safe_load(open("policies/quality-security/hygon-quality-security-v1.1.yaml"))["images"]["gitleaks"])')
          docker pull "$image"

      - name: Real advisory secret scanner regression
        env:
          PYTHONPATH: src
        run: python3 tests/gitleaks_integration.py
