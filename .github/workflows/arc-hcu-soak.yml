name: Trusted three-node nonroot HCU validation
on:
  workflow_call:
    inputs:
      case:
        type: string
        required: true
permissions:
  contents: read
jobs:
  fleet:
    if: github.repository == 'HYGON-AI/quality-gate' && github.ref == 'refs/heads/test/arc-platform-20261106' && github.event_name == 'push' && contains(fromJSON('["cpu","cpu-build","hcu1","hcu2","hcu4","hcu8"]'), inputs.case)
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        node: [github-nmz3, github-nmz4, github-nmz6]
    name: Nonroot ${{ inputs.case }} on ${{ matrix.node }}
    runs-on: hygon-k8s-dispatch
    timeout-minutes: 7
    env:
      CI_NODE: ${{ matrix.node }}
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          repository: HYGON-AI/quality-gate
          ref: a88adf75fd68c40fd461ae8340a1e2b27d224491
          persist-credentials: false
      - name: Compile and compute through Volcano
        env:
          CI_CASE: ${{ inputs.case }}
        run: exec python3 scripts/arc-hcu-soak.py "$CI_CASE"
      - name: Independently verify owned compute cleanup
        if: always()
        run: exec python3 scripts/arc-hcu-soak.py cleanup-only
      - name: Upload image identity and test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: arc-hcu-soak-${{ matrix.node }}-${{ inputs.case }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/arc-ci-e2e
          if-no-files-found: error
          retention-days: 7
