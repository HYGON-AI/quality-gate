name: Trusted three-node ARC soak
on:
  workflow_call:
    inputs:
      mode:
        type: string
        required: true
permissions:
  contents: read
jobs:
  cpu:
    if: github.repository == 'HYGON-AI/quality-gate' && github.ref == 'refs/heads/test/arc-platform-20261106' && github.event_name == 'push' && inputs.mode == 'cpu'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        node: [github-nmz3, github-nmz4, github-nmz6]
        case: [cpu, cpu-build]
    name: Soak ${{ matrix.case }} on ${{ matrix.node }}
    runs-on: hygon-k8s-dispatch
    timeout-minutes: 7
    env:
      CI_NODE: ${{ matrix.node }}
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          repository: HYGON-AI/quality-gate
          ref: b64337a789a29ea7cf0bdd2786d51c69a79fe7b6
          persist-credentials: false
      - name: Real build and test via Volcano
        env:
          CI_CASE: ${{ matrix.case }}
        run: exec python3 scripts/arc-soak.py "$CI_CASE"
      - name: Independently verify owned compute cleanup
        if: always()
        run: exec python3 scripts/arc-soak.py cleanup-only
      - name: Upload reports and build artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: arc-soak-${{ matrix.node }}-${{ matrix.case }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/arc-ci-e2e
          retention-days: 7
          if-no-files-found: error
  fault:
    if: github.repository == 'HYGON-AI/quality-gate' && github.ref == 'refs/heads/test/arc-platform-20261106' && github.event_name == 'push' && contains(fromJSON('["cpu-failure","cpu-cancel","cpu-timeout","cpu-orphan"]'), inputs.mode)
    name: Controlled fault ${{ inputs.mode }}
    runs-on: hygon-k8s-dispatch
    timeout-minutes: 7
    env:
      CI_NODE: github-nmz3
      CI_CASE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          repository: HYGON-AI/quality-gate
          ref: b64337a789a29ea7cf0bdd2786d51c69a79fe7b6
          persist-credentials: false
      - name: Execute controlled compute fault
        run: exec python3 scripts/arc-soak.py "$CI_CASE"
      - name: Independently verify owned compute cleanup
        if: always()
        run: exec python3 scripts/arc-soak.py cleanup-only
      - name: Upload fault evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: arc-soak-fault-${{ inputs.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/arc-ci-e2e
          retention-days: 7
          if-no-files-found: error
